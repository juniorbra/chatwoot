version: "3.7"

services:
  chatwoot_rails:
    image: chatwoot/chatwoot:latest

    networks:
      - rede_interna

    ports:
      - "3000:3000"

    labels:
      - traefik.enable=true
      - traefik.http.routers.chatwoot.rule=Host(`chat.adavance.com.br`)
      - traefik.http.routers.chatwoot.entrypoints=websecure
      - traefik.http.routers.chatwoot.priority=1
      - traefik.http.routers.chatwoot.tls.certresolver=letsencryptresolver
      - traefik.http.routers.chatwoot.service=chatwoot
      - traefik.http.services.chatwoot.loadbalancer.server.port=3000
      - traefik.http.services.chatwoot.loadbalancer.passHostHeader=true

    environment:
      ## Database (usando seu Postgres existente)
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=18d66c7e69de8f1dd34b715552f366d7

      ## Redis (usando seu Redis do n8n)
      - REDIS_URL=redis://n8n_redis:6379/2
      - REDIS_PASSWORD=

      ## Rails
      - RAILS_ENV=production
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - FRONTEND_URL=${FRONTEND_URL:-https://chat.adavance.com.br}
      - RAILS_LOG_TO_STDOUT=true

      ## Timezone
      - TZ=America/Sao_Paulo
      - GENERIC_TIMEZONE=America/Sao_Paulo

      ## Outros
      - ENABLE_ACCOUNT_SIGNUP=false
      - FORCE_SSL=true

    volumes:
      - chatwoot_storage:/app/storage

    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "2"
          memory: 2048M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  chatwoot_sidekiq:
    image: chatwoot/chatwoot:latest

    networks:
      - rede_interna

    environment:
      ## Database
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=18d66c7e69de8f1dd34b715552f366d7

      ## Redis
      - REDIS_URL=redis://n8n_redis:6379/2
      - REDIS_PASSWORD=

      ## Rails
      - RAILS_ENV=production
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - RAILS_LOG_TO_STDOUT=true

      ## Timezone
      - TZ=America/Sao_Paulo

    volumes:
      - chatwoot_storage:/app/storage

    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

volumes:
  chatwoot_storage:
    external: true
    name: chatwoot_storage

networks:
  rede_interna:
    external: true
    name: rede_interna
