name: Upstream Update Check

on:
  schedule:
    # Todo dia 1 de cada mês às 9h UTC (6h BRT)
    - cron: '0 9 1 * *'
  workflow_dispatch:  # Permite executar manualmente

jobs:
  check-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para comparar históricos
          ref: feature/kanban-crm

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/chatwoot/chatwoot.git || true
          git fetch upstream master

      - name: Check commits behind
        id: check
        run: |
          # Contar quantos commits estamos atrás
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "commits_behind=$BEHIND" >> $GITHUB_OUTPUT

          # Buscar última release oficial do Chatwoot
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/chatwoot/chatwoot/releases/latest | jq -r .tag_name)
          echo "latest_release=$LATEST_RELEASE" >> $GITHUB_OUTPUT

          # Definir nível de urgência
          if [ $BEHIND -gt 50 ]; then
            echo "level=🔴 CRÍTICO" >> $GITHUB_OUTPUT
          elif [ $BEHIND -gt 20 ]; then
            echo "level=🟡 ATENÇÃO" >> $GITHUB_OUTPUT
          else
            echo "level=🟢 OK" >> $GITHUB_OUTPUT
          fi

      - name: Create or update sync issue
        if: steps.check.outputs.commits_behind > 20
        uses: actions/github-script@v7
        with:
          script: |
            const behind = '${{ steps.check.outputs.commits_behind }}';
            const latestRelease = '${{ steps.check.outputs.latest_release }}';
            const level = '${{ steps.check.outputs.level }}';
            const currentDate = new Date().toISOString().split('T')[0];

            // Verificar se já existe issue aberta
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync,upstream'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes('Chatwoot Sync')
            );

            const issueBody = `
            ## 📊 Status do Sync com Chatwoot Oficial

            **Commits atrás:** ${behind}
            **Última release oficial:** [${latestRelease}](https://github.com/chatwoot/chatwoot/releases/tag/${latestRelease})
            **Nível:** ${level}
            **Data da verificação:** ${currentDate}

            ---

            ### 📋 Checklist de Sync

            #### 1. Preparação
            - [ ] Ler [CHANGELOG do ${latestRelease}](https://github.com/chatwoot/chatwoot/releases/tag/${latestRelease})
            - [ ] Identificar breaking changes
            - [ ] Verificar se há features que podem conflitar com Pipeline/Kanban
            - [ ] Avisar time sobre sync planejado
            - [ ] Criar backup completo (já temos backup automático, mas conferir)

            #### 2. Execução
            - [ ] Criar branch temporária: \`test/sync-${currentDate}\`
            - [ ] Mergear upstream/master na branch temporária
            - [ ] Resolver conflitos (schema.rb, routes.rb)
            - [ ] Rodar testes: \`bundle exec rspec && pnpm test\`
            - [ ] Corrigir linters: \`bundle exec rubocop -a && pnpm eslint:fix\`

            #### 3. Validação
            - [ ] Testar manualmente Pipeline/Kanban funcionando
            - [ ] Verificar custom branding intacto
            - [ ] Testar com cliente piloto
            - [ ] Monitorar por 3-7 dias

            #### 4. Finalização
            - [ ] Mergear em feature/kanban-crm
            - [ ] Criar tag v${latestRelease}-botvance.1
            - [ ] Atualizar CHANGELOG.botvance.md
            - [ ] Deploy gradual em produção

            ---

            ### 🔧 Comandos para Executar

            \`\`\`bash
            # 1. Atualizar master
            git checkout master
            git fetch upstream master
            git merge upstream/master --ff-only
            git push origin master

            # 2. Testar em branch temporária
            git checkout -b test/sync-${currentDate} feature/kanban-crm
            git merge master

            # 3. Resolver conflitos de schema.rb (se houver)
            git checkout --theirs db/schema.rb
            bundle exec rails db:migrate
            bundle exec rails db:schema:dump
            git add db/schema.rb

            # 4. Rodar testes
            bundle exec rspec
            pnpm test
            bundle exec rubocop -a
            pnpm eslint:fix

            # 5. Se tudo OK, mergear de verdade
            git checkout feature/kanban-crm
            git merge test/sync-${currentDate} -m "chore: sync with Chatwoot ${latestRelease}"

            # 6. Criar tag de release
            git tag -a v${latestRelease}-botvance.1 -m "Sync com Chatwoot ${latestRelease}"
            git push origin feature/kanban-crm --tags

            # 7. Limpar branch temporária
            git branch -d test/sync-${currentDate}
            \`\`\`

            ---

            ### ⚠️ IMPORTANTE

            - **SEMPRE testar em staging antes de produção!**
            - Se não tiver staging, testar localmente primeiro
            - Usar cliente piloto para validação
            - Monitorar logs após deploy
            - Ter plano de rollback pronto (usar backup tag)

            ---

            ### 📚 Referências

            - [CHANGELOG.botvance.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/feature/kanban-crm/CHANGELOG.botvance.md)
            - [docs/GIT_WORKFLOW.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/feature/kanban-crm/docs/GIT_WORKFLOW.md)
            - [Chatwoot Releases](https://github.com/chatwoot/chatwoot/releases)
            `;

            if (existingIssue) {
              // Atualizar issue existente
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                title: `${level} Chatwoot Sync: ${behind} commits atrás (${latestRelease})`,
                body: issueBody
              });

              // Adicionar comentário
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔄 **Atualização automática** - ${currentDate}\n\nAgora estamos **${behind} commits** atrás do upstream.`
              });
            } else {
              // Criar nova issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${level} Chatwoot Sync: ${behind} commits atrás (${latestRelease})`,
                body: issueBody,
                labels: ['sync', 'upstream', 'maintenance']
              });
            }

      - name: Summary
        if: steps.check.outputs.commits_behind <= 20
        run: |
          echo "✅ Tudo certo! Estamos apenas ${{ steps.check.outputs.commits_behind }} commits atrás do upstream."
          echo "Nível: ${{ steps.check.outputs.level }}"
          echo "Última release oficial: ${{ steps.check.outputs.latest_release }}"
