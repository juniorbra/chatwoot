<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <title>logo-ai-white-transparent</title>
    <defs>
        <style>
            /* Estilo do texto AI */
            .ai-text {
                font-family: Arial, Helvetica, sans-serif;
